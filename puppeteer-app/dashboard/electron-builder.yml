appId: com.nexus.panel
forceCodeSigning: false
productName: Nexus Dashboard
directories:
  output: dist
files:
  - out/**/*
  - resources/**/*
  - package.json
asar: true
asarUnpack:
  - "**/node_modules/better-sqlite3/**/*"
win:
  target: nsis

  signAndEditExecutable: false
  icon: resources/icon.ico

extraResources:
  - from: "../"
    to: "app-scripts"
    filter:
      - "*.js"
      - "utils/**/*"
      - "chrome/**/*"
      - "personalities.json"
      - "keywords*.txt"
      - "proxies.json"
      - "bot_settings.json"
      - "browser-config.json"
      - "!node_modules"
      - "!dashboard"
      - "!.git"
  - from: "../../node_modules"
    to: "node_modules"
    filter:
      - "**/*"
      - "!better-sqlite3/**/*"
  - from: "../node_modules"
    to: "node_modules"
    filter:
      - "**/*"
      - "!better-sqlite3/**/*"
  - from: "node_modules/better-sqlite3"
    to: "node_modules/better-sqlite3"
